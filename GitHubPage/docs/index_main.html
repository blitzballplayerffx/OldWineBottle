<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legends of Aetheria MMORPG</title>
    <link rel="stylesheet" href="stylesheet_main.css">
</head>
<body>

    <!-- =========================
         HOME SECTION
         ========================= -->
    <section class="card home" id="home">
        <!-- Top Navigation Buttons -->
        <div class="top-nav-bar" id="top-nav-bar"></div>

        <h1>Legends of Aetheria</h1>



        <!-- Home Hero Layout -->
        <div class="home-hero-layout">
            <img src="images/party-banner.jpg" alt="Party Showcase" class="home-banner-img">

            <nav class="quick-links-bar" id="quick-links-bar"></nav>
        </div>

        <!-- Auto-Cycling Carousel Slider -->
        <div class="slider" id="homeSlider"></div>

        <!-- Home Slider Dots Indicator -->
        <div class="slider-dots" id="homeDots"></div>
    </section>

    <!-- =========================
         STORY SECTION
         ========================= -->
    <section class="card story" id="story">
        <div class="story-content" id="storyContent"></div>
    </section>

    <!-- =========================
         FEATURES SECTION
         ========================= -->
    <section class="card features-section" id="features">
        <div class="slider" id="featuresSlider"></div>
        <div class="bottom-nav" id="featuresNav"></div>
    </section>

    <!-- =========================
         REALMS SECTION
         ========================= -->
    <section class="card realms" id="realms">
        <div class="slider" id="realmsSlider"></div>
        <div class="bottom-nav" id="realmsNav"></div>
    </section>

    <!-- =========================
         RACES SECTION
         ========================= -->
    <section class="card races" id="races">
        <div class="slider" id="racesSlider"></div>
        <div class="bottom-nav" id="racesNav"></div>
    </section>

    <!-- =========================
         CLASSES SECTION
         ========================= -->
    <section class="card classes" id="classes">
        <div class="slider" id="classesSlider"></div>
        <div class="bottom-nav" id="classesNav"></div>
    </section>

    <script src="script_main.js"></script>
</body>
</html>
