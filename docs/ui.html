<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG UI Prototype</title>
    <link rel="stylesheet" href="./ui/style.css">
</head>
<body>
    <main id="app" aria-label="MMORPG user interface prototype">
        <div class="world-backdrop" aria-hidden="true">
            <div class="sun"></div>
            <div class="mountain mountain-back"></div>
            <div class="mountain mountain-mid"></div>
            <div class="mountain mountain-front"></div>

            <div class="tree tree-left">
                <span class="tree-trunk"></span>
            </div>
            <div class="tree tree-mid-left">
                <span class="tree-trunk"></span>
            </div>
            <div class="tree tree-mid-right">
                <span class="tree-trunk"></span>
            </div>
            <div class="tree tree-right">
                <span class="tree-trunk"></span>
            </div>

            <div class="ground"></div>
            <div class="fog"></div>
        </div>

        <section id="ui-stage" class="ui-stage" aria-label="Game interface">
            <div class="reticle" aria-hidden="true"><span></span></div>
        </section>

        <button id="settings-toggle" class="settings-toggle" type="button" aria-controls="settings-panel" aria-expanded="false" title="Open menu">
            <span>Menu</span>
        </button>

        <div id="menu-popover" class="menu-popover" hidden>
            <button type="button" data-menu-action="ui-settings">UI Settings</button>
            <button type="button" data-menu-action="character">Character</button>
            <button type="button" data-menu-action="quest">Quest Log</button>
            <button type="button" data-menu-action="inventory">Inventory</button>
            <button type="button" data-menu-action="journal">Journal</button>
            <button type="button" data-menu-action="skills">Skills</button>
            <button type="button" data-menu-action="party">Party</button>
            <button type="button" data-menu-action="system">System</button>
        </div>

        <aside id="settings-panel" class="settings-panel" aria-label="Interface settings" hidden>
            <div class="panel-heading">
                <div>
                    <h2>UI Settings</h2>
                </div>
            </div>
            <fieldset class="window-visibility">
                <legend>Windows</legend>
                <label class="window-toggle-item">
                    <span class="toggle-input-wrap">
                        <input type="checkbox" data-window-toggle="character">
                        <button class="window-settings" type="button" data-window-settings="character" aria-label="Character window settings">⚙</button>
                    </span>
                    <span class="toggle-label">Character</span>
                </label>
                <label class="window-toggle-item">
                    <span class="toggle-input-wrap">
                        <input type="checkbox" data-window-toggle="quest">
                        <button class="window-settings" type="button" data-window-settings="quest" aria-label="Quest window settings">⚙</button>
                    </span>
                    <span class="toggle-label">Quest log</span>
                </label>
                <label class="window-toggle-item">
                    <span class="toggle-input-wrap">
                        <input type="checkbox" data-window-toggle="inventory">
                        <button class="window-settings" type="button" data-window-settings="inventory" aria-label="Inventory window settings">⚙</button>
                    </span>
                    <span class="toggle-label">Inventory</span>
                </label>
                <label class="window-toggle-item">
                    <span class="toggle-input-wrap">
                        <input type="checkbox" data-window-toggle="journal">
                        <button class="window-settings" type="button" data-window-settings="journal" aria-label="Journal window settings">⚙</button>
                    </span>
                    <span class="toggle-label">Journal</span>
                </label>
                <label class="window-toggle-item">
                    <span class="toggle-input-wrap">
                        <input type="checkbox" data-window-toggle="skills">
                        <button class="window-settings" type="button" data-window-settings="skills" aria-label="Skills window settings">⚙</button>
                    </span>
                    <span class="toggle-label">Skills</span>
                </label>
                <label class="window-toggle-item">
                    <span class="toggle-input-wrap">
                        <input type="checkbox" data-window-toggle="party">
                        <button class="window-settings" type="button" data-window-settings="party" aria-label="Party window settings">⚙</button>
                    </span>
                    <span class="toggle-label">Party</span>
                </label>
                <label class="window-toggle-item">
                    <span class="toggle-input-wrap">
                        <input type="checkbox" data-window-toggle="minimap">
                        <button class="window-settings" type="button" data-window-settings="minimap" aria-label="Map window settings">⚙</button>
                    </span>
                    <span class="toggle-label">Map</span>
                </label>
                <label class="window-toggle-item">
                    <span class="toggle-input-wrap">
                        <input type="checkbox" data-window-toggle="chat">
                        <button class="window-settings" type="button" data-window-settings="chat" aria-label="Chat window settings">⚙</button>
                    </span>
                    <span class="toggle-label">Chat</span>
                </label>
                <label class="window-toggle-item">
                    <span class="toggle-input-wrap">
                        <input type="checkbox" data-window-toggle="system">
                        <button class="window-settings" type="button" data-window-settings="system" aria-label="System window settings">⚙</button>
                    </span>
                    <span class="toggle-label">System</span>
                </label>
                <label class="window-toggle-item">
                    <span class="toggle-input-wrap">
                        <input type="checkbox" data-hotbar-toggle="1" checked>
                        <button class="window-settings" type="button" data-window-settings="hotbar-1" aria-label="Skill Bar 1 settings">⚙</button>
                    </span>
                    <span class="toggle-label">Skill Bar 1</span>
                </label>
                <label class="window-toggle-item">
                    <span class="toggle-input-wrap">
                        <input type="checkbox" data-hotbar-toggle="2">
                        <button class="window-settings" type="button" data-window-settings="hotbar-2" aria-label="Skill Bar 2 settings">⚙</button>
                    </span>
                    <span class="toggle-label">Skill Bar 2</span>
                </label>
                <label class="window-toggle-item">
                    <span class="toggle-input-wrap">
                        <input type="checkbox" data-hotbar-toggle="3">
                        <button class="window-settings" type="button" data-window-settings="hotbar-3" aria-label="Skill Bar 3 settings">⚙</button>
                    </span>
                    <span class="toggle-label">Skill Bar 3</span>
                </label>
            </fieldset>
            <label class="control-row" for="opacity-control">
                <span>Opacity</span>
                <output id="opacity-value" for="opacity-control">100%</output>
            </label>
            <input id="opacity-control" type="range" min="0.35" max="1" step="0.01" value="1.0">

            <label class="control-row" for="background-color-control">
                <span>Background</span>
                <output for="background-color-control">Theme</output>
            </label>
            <input id="background-color-control" type="color" value="#171d1f" aria-label="Pick a UI background color">
        </aside>

        <div id="window-settings-popover" class="window-settings-popover" hidden></div>
    </main>
    <script src="./ui/script.js"></script>
</body>
</html>
